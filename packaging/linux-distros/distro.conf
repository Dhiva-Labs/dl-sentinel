# Package metadata for the Linux distribution packages (.rpm, Arch, AUR
# PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh, verify.sh
# and packaging/arch/aur.sh. Keep it in step with debian/control.

NAME=dlsentinel              # the .deb's package name
APP_NAME='DL Sentinel'
GITHUB_REPO=Dhiva-Labs/dl-sentinel
TAG_PREFIX=v                 # release tags are v1.2.3
SUMMARY='Security scanner for secrets, dependencies, code and infrastructure'
DESCRIPTION='DL Sentinel scans a repository for exposed secrets, vulnerable dependencies, insecure source-code patterns, container and infrastructure misconfiguration, API definition security issues and smart-contract risk patterns, then reports structured findings as terminal output, JSON, Markdown or SARIF 2.1.0. Scanning runs entirely on the local machine and the scanner makes no network request unless a network-backed vulnerability data source is enabled. This package provides the command-line scanner (dl-sentinel, also installed as sentinel); the self-hosted API server and web dashboard are not included.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/dl-sentinel
LICENSE=MIT
LICENSE_FILE=LICENSE

# Like the .deb (Architecture: all): one bundled JavaScript file run by the
# distribution's own Node.js, no native code. One noarch .rpm and one "any"
# Arch package, installed on x86_64 and aarch64.
ARCH_INDEPENDENT=1

# The launcher execs /usr/bin/node (Fedora: nodejsNN-bin, Arch: nodejs).
RPM_REQUIRES=(/usr/bin/node)
ARCH_DEPENDS=(nodejs)

APPIMAGE=0                   # command-line tool: no AppImage or Flatpak

# Smoke test run in each distribution container by verify.sh and after the
# AUR build by aur.sh: the same checks as CI's deb-install job.
GUI_CMD=''
SMOKE_CMD='bash /linux-distros/smoke.sh'
