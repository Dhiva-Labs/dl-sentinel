# I026 negative, and fully clean: resources.limits is set.
apiVersion: v1
kind: Pod
metadata:
  name: resource-limits-example
spec:
  containers:
    - name: app
      image: example/app:1.0.0
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
      resources:
        requests:
          cpu: '100m'
          memory: '128Mi'
        limits:
          cpu: '250m'
          memory: '256Mi'
