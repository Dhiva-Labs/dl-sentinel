# Fully clean negative control combining every safe pattern at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clean-example
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clean-example
  template:
    metadata:
      labels:
        app: clean-example
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: app
          image: example/app:1.0.0
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            limits:
              cpu: '250m'
              memory: '256Mi'
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: clean-db
                  key: url
