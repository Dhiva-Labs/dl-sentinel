# I016 positive: database ports published without a host IP restriction.
# The web service's ordinary port must not be flagged.
services:
  db:
    image: postgres:16
    ports:
      - '5432:5432'
  cache:
    image: redis:7
    ports:
      - '6379:6379'
  web:
    image: example/web:1.0.0
    ports:
      - '8080:8080'
