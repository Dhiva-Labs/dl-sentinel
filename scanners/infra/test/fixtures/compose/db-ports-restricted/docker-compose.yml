# I016 negative: the database port is bound to localhost only.
services:
  db:
    image: postgres:16
    ports:
      - '127.0.0.1:5432:5432'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  web:
    image: example/web:1.0.0
    ports:
      - '8080:8080'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
