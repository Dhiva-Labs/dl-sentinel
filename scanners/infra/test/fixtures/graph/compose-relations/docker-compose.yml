# Graph fixture: depends_on (list form and long-syntax map form) and links,
# including a dangling depends_on reference that must be dropped rather than
# produce a dangling edge.
services:
  db:
    image: postgres:16
  cache:
    image: redis:7
  api:
    image: example/api:1.0.0
    depends_on:
      - db
      - missing-service
    links:
      - cache:cache-alias
  web:
    image: example/web:1.0.0
    depends_on:
      api:
        condition: service_healthy
