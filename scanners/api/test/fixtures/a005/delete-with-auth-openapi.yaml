openapi: 3.0.3
info:
  title: A005 Delete With Auth Fixture
  version: 1.0.0
paths:
  /items/{id}:
    delete:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
